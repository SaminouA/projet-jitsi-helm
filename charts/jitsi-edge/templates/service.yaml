apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: jitsi-edge
  labels:
    app.kubernetes.io/instance: jitsi-edge
    app.kubernetes.io/name: jitsi-edge
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-ip-addresses: {{ .Values.service.addressName | quote }}
spec:
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: jitsi-edge
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
