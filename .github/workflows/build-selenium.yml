name: Build and publish synthetic Selenium
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selenium-image-publication
  cancel-in-progress: false
jobs:
  selenium:
    if: github.repository == 'SaminouA/projet-jitsi-helm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check disk and prepare isolated build context
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free=$(df -B1 --output=avail / | tail -1)
          test "$free" -ge 6442450944
          context="$RUNNER_TEMP/selenium-context"
          mkdir -p "$context"
          python3 scripts/generate-synthetic-media.py --output "$context/resources"
          cp tests/load/docker/Dockerfile.selenium "$context/Dockerfile"
          cp tests/load/docker/chrome-wrapper.sh "$context/chrome-wrapper.sh"
          echo "IMAGE=ghcr.io/saminoua/jitsi-selenium:synthetic-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build amd64 image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/SaminouA/projet-jitsi-helm \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE" "$RUNNER_TEMP/selenium-context"
      - name: Check media files as image default user
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test "$(id -u)" != 0
            test -x /opt/jitsi/chrome-wrapper
            /usr/bin/google-chrome --version
            chromedriver --version
            grep -F /opt/jitsi/chrome-wrapper /opt/selenium/browser_binary_location
            cd /usr/share/jitsi-meet-torture/resources
            test -r FourPeople_1280x720_30.y4m
            test -r fakeAudioStream.wav
            sha256sum FourPeople_1280x720_30.y4m fakeAudioStream.wav
          ' > "$RUNNER_TEMP/image-media-check.txt"
          head -n 3 "$RUNNER_TEMP/image-media-check.txt"
          cd "$RUNNER_TEMP/selenium-context/resources"
          sha256sum FourPeople_1280x720_30.y4m fakeAudioStream.wav > "$RUNNER_TEMP/expected-media.sha256"
          tail -2 "$RUNNER_TEMP/image-media-check.txt" > "$RUNNER_TEMP/actual-media.sha256"
          diff -u "$RUNNER_TEMP/expected-media.sha256" "$RUNNER_TEMP/actual-media.sha256"
      - name: Test real synthetic camera and microphone
        id: media
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name selenium-smoke --platform linux/amd64 \
            --shm-size=1g --memory=3g --cpus=2 \
            --tmpfs /tmp:rw,size=1g,mode=1777 -p 127.0.0.1:4444:4444 "$IMAGE"
          status=0
          python3 scripts/test-selenium-media.py > "$RUNNER_TEMP/media-result.json" || status=$?
          cat "$RUNNER_TEMP/media-result.json"
          exit "$status"
      - name: Publish only after media test success
        if: success() && steps.media.outcome == 'success'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf 'Image: `%s`\n\nDigest: `%s`\n\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/media-result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup local runner only
        if: always()
        run: |
          docker rm -f selenium-smoke 2>/dev/null || true
          docker logout ghcr.io || true
