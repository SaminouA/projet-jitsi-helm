# Preparation locale uniquement : aucune execution autorisee ou declenchee.
name: Diagnostic OIDC GKE et SOPS (sans deploiement)
'on':
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: Confirmer le diagnostic sans deploiement sur main
        type: boolean
        required: true
        default: false
permissions: {}
concurrency:
  group: deploy-jitsi-gke-main
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'SaminouA/projet-jitsi-helm' && github.ref == 'refs/heads/main'
      && inputs.confirm_read_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      JITSI_ACCESS_PROFILE: public-edge
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: SaminouA/projet-jitsi-helm
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python3 -m pip install -r scripts/requirements.txt
    - name: Verifier le contexte de confiance avant OIDC
      run: python3 scripts/diagnose-cd.py --guard-only
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      with:
        version: v3.22.1
    - name: Installer SOPS epingle avec verification SHA256
      shell: bash
      run: |
        set -euo pipefail
        download_dir=$(mktemp -d "$RUNNER_TEMP/sops-install.XXXXXX")
        trap 'rm -rf "$download_dir"' EXIT
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64 \
          --output "$download_dir/sops"
        echo "775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef  $download_dir/sops" | sha256sum --check --status
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$download_dir/sops" "$HOME/.local/bin/sops"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Authentification OIDC vers Google Cloud (sans cle privee JSON)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        project_id: project-fcf2ef91-c005-4910-a10
        workload_identity_provider: projects/198310729956/locations/global/workloadIdentityPools/github-jitsi-pool/providers/github-provider
        service_account: github-jitsi-deployer@project-fcf2ef91-c005-4910-a10.iam.gserviceaccount.com
        create_credentials_file: 'true'
        cleanup_credentials: 'true'
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      with:
        install_components: kubectl,gke-gcloud-auth-plugin
    - name: Configurer l'acces au cluster existant
      uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395
      with:
        project_id: project-fcf2ef91-c005-4910-a10
        cluster_name: jitsi-cluster
        location: europe-west1-b
        use_auth_provider: 'true'
    - name: Diagnostic lecture seule et SOPS temporaire
      run: python3 scripts/diagnose-cd.py
    - name: Nettoyage de secours des donnees sensibles
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${CD_DIAG_TMP_DIR:-}" && "$CD_DIAG_TMP_DIR" == "$RUNNER_TEMP"/jitsi-diagnostic.* ]]; then
          rm -rf -- "$CD_DIAG_TMP_DIR"
        fi
