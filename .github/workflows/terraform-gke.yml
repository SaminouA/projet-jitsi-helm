name: Terraform GKE controlled label apply
'on':
  workflow_run:
    workflows: [Validation Helm et Terraform]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: deploy-jitsi-gke-main
  cancel-in-progress: false
jobs:
  terraform:
    if: >-
      vars.TF_CD_ENABLED == 'true' && vars.GKE_CD_ENABLED != 'true' &&
      vars.TF_APPROVED_SHA == github.event.workflow_run.head_sha &&
      github.repository == 'SaminouA/projet-jitsi-helm' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: terraform-controlled
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      TF_APPROVED_SHA: ${{ vars.TF_APPROVED_SHA }}
      TF_CD_ENABLED: ${{ vars.TF_CD_ENABLED }}
      HELM_CD_ENABLED: ${{ vars.GKE_CD_ENABLED }}
      TF_STATE_LINEAGE: ${{ vars.TF_STATE_LINEAGE }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      GH_TOKEN: ${{ github.token }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SaminouA/projet-jitsi-helm
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Gardes avant OIDC
        run: python3 scripts/terraform-controlled.py --guard-only
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: project-fcf2ef91-c005-4910-a10
          workload_identity_provider: projects/198310729956/locations/global/workloadIdentityPools/github-jitsi-pool/providers/github-terraform-provider
          service_account: terraform-jitsi-deployer@project-fcf2ef91-c005-4910-a10.iam.gserviceaccount.com
          create_credentials_file: 'true'
          cleanup_credentials: 'true'
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Plan strict, apply sauvegarde et verification
        run: python3 scripts/terraform-controlled.py
      - name: Nettoyer les plans et metadonnees prives
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TF_CONTROLLED_TMP:-}" && "$TF_CONTROLLED_TMP" == "$RUNNER_TEMP"/jitsi-terraform.* ]]; then
            rm -rf -- "$TF_CONTROLLED_TMP"
          fi
