
name: CI Helm Jitsi

on:
  push:
    branches:
      - feature/ci-helm
      - main
  pull_request:
    branches:
      - main

jobs:
  helm-validation:
    name: Validation Helm
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Verifier le Chart Helm
        run: helm lint ./charts-officiels/jitsi-meet -f mes-valeurs.yaml

      - name: Generer les manifestes Kubernetes
        run: helm template mon-jitsi ./charts-officiels/jitsi-meet -f mes-valeurs.yaml > /tmp/jitsi-rendu.yaml
