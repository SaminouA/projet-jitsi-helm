name: Validation Helm et Terraform
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    name: Validation Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Valider les deux profils Helm et Terraform sans backend
        run: sh scripts/validate.sh
      - name: Preparer Caddy pour validation statique uniquement
        run: sh scripts/fetch-caddy.sh "$RUNNER_TEMP/caddy-validation"
      - name: Valider le profil public et les protections edge
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy-validation/caddy
        run: |
          python3 scripts/validate-edge.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
