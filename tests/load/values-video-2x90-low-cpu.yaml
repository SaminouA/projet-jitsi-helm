# Overlay on values-video-2x90.yaml. PREPARED ONLY: no second test authorized yet.
# Same validated images, two peers and 90 seconds; Job remains suspended.
selenium:
  sessions: 2
  avoidJvb: true
  jvbNamespace: jitsi
  jvbRelease: jitsi
  javaOpts: '-Xms128m -Xmx256m'
  resources:
    requests: {cpu: 750m, memory: 1Gi, ephemeral-storage: 128Mi}
    limits: {cpu: 900m, memory: 2Gi, ephemeral-storage: 512Mi}
malleus:
  suspend: true
  participants: 2
  duration: 90
  resources:
    requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
    limits: {cpu: 300m, memory: 768Mi, ephemeral-storage: 1Gi}
